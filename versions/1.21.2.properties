# no 1.21.2 release, so the 1.21.3 Parchment names are used (they only affect parameter names).
minecraft_version=1.21.2
minecraft_version_range=[1.21.2, 1.21.3)
neo_form_version=1.21.2-20241022.151510
parchment_minecraft=1.21.3
parchment_version=2024.12.07
fabric_version=0.106.1+1.21.2
neoforge_version=21.2.1-beta
