plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom-remap'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

// ./gradlew :fabric:runDatagen writes generated data into the common project, shared by both loaders.
fabricApi {
    configureDataGeneration {
        outputDirectory = project(':common').file('src/generated/resources')
        addToResources = false
        // Since 1.21.4 model datagen is client-side; a client datagen run covers both models and data.
        client = true
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        // Dev-only: launches a client that photographs the showcase scenes and quits (see ShowcaseDirector).
        showcase {
            client()
            setConfigName('Fabric Showcase')
            ideConfigGenerated(false)
            runDir('runs/showcase')
            vmArg('-Dchristmasgrove.showcase=true')
            programArgs('--quickPlaySingleplayer', 'showcase', '--width', '1920', '--height', '1080')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
