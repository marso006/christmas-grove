pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups('org.spongepowered')
            }
        }
    }
}

plugins {
    // Downloads the Java 21 toolchain automatically if it is not installed.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Should match the folder name, or IntelliJ may complain (https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'christmas-grove'
include('common')
include('fabric')
include('neoforge')
