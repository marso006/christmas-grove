name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle and Loom 1.19 run on Java 25; the Java 21 compile toolchain is downloaded by foojay.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all jars (this branch's main Minecraft version)
        run: ./gradlew build --console=plain

      - name: Build extra Minecraft versions from versions/*.properties
        shell: bash
        run: |
          for f in versions/*.properties; do
            [ -e "$f" ] || continue
            mc=$(basename "$f" .properties)
            echo "::group::Minecraft $mc"
            tools/build-target.sh "$mc" build
            echo "::endgroup::"
          done

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: christmas-grove-jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
          if-no-files-found: error
